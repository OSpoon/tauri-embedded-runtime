[package]
name = "tauri-embedded-runtime"
version = "0.0.0"
description = "A private Python and Node.js runtime manager for Tauri applications"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_embedded_runtime_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib",
]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
tauri = { version = "2", features = [ "image-png" ] }
tauri-plugin-opener = "2"
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = [ "std" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
fs2 = "0.4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
sha2 = "0.10"
tar = "0.4"
zip = { version = "6", default-features = false, features = [ "deflate" ] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
